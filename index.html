<script>
(function () {
  'use strict';
  var TRACK_URL = 'https://suivipatient.duckdns.org/barachid/track';
  var VID_KEY = 'br-vid';

  function visitorId() {
    var v = null;
    try { v = localStorage.getItem(VID_KEY); } catch (e) { return 'anon'; }
    if (v && /^v[a-z0-9-]{6,38}$/.test(v)) return v;
    v = 'v' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
    try { localStorage.setItem(VID_KEY, v); } catch (e) { /* private mode */ }
    return v;
  }

  function track(event, data) {
    try {
      var body = JSON.stringify({ vid: visitorId(), event: event, ts: Date.now(), data: data || {} });
      if (navigator.sendBeacon) {
        var blob = new Blob([body], { type: 'text/plain;charset=UTF-8' });
        if (navigator.sendBeacon(TRACK_URL, blob)) return;
      }
      if (window.fetch) {
        fetch(TRACK_URL, { method: 'POST', body: body, keepalive: true, mode: 'cors',
                           credentials: 'omit', headers: { 'Content-Type': 'text/plain' } })
          .catch(function () {});
      }
    } catch (e) { /* tracking never affects the page */ }
  }

  function px(ev) { try { if (window.fbq) window.fbq('track', ev); } catch (e) {} }

  document.getElementById('wa-btn').addEventListener('click', function () {
    track('wa_direct', {}); px('Contact');
  });
  document.getElementById('call-btn').addEventListener('click', function () {
    track('call', {}); px('Contact');
  });

  /* gallery dots — passive scroll listener, no library */
  var gal = document.getElementById('gallery');
  var dotsBox = document.getElementById('dots');
  var cards = gal.querySelectorAll('.gcard');
  for (var i = 0; i < cards.length; i++) {
    var d = document.createElement('span');
    d.className = 'dot' + (i === 0 ? ' on' : '');
    dotsBox.appendChild(d);
  }
  var dots = dotsBox.children;
  var cur = 0;             /* index of the card nearest center — dots + arrows share it */
  var ticking = false;
  gal.addEventListener('scroll', function () {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () {
      ticking = false;
      /* viewport-rect math — RTL scrollLeft semantics differ per browser */
      var g = gal.getBoundingClientRect();
      var mid = g.left + g.width / 2;
      var best = 0, bestDist = Infinity;
      for (var j = 0; j < cards.length; j++) {
        var r = cards[j].getBoundingClientRect();
        var dist = Math.abs(r.left + r.width / 2 - mid);
        if (dist < bestDist) { bestDist = dist; best = j; }
      }
      cur = best;
      for (var k = 0; k < dots.length; k++) dots[k].className = 'dot' + (k === best ? ' on' : '');
    });
  }, { passive: true });

  /* swipe guard — a drag that ends on a card must NOT count as a tap */
  var swiping = false, sx = 0, sy = 0;
  gal.addEventListener('touchstart', function (e) {
    swiping = false;
    if (e.touches && e.touches[0]) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }
  }, { passive: true });
  gal.addEventListener('touchmove', function (e) {
    if (!e.touches || !e.touches[0]) return;
    if (Math.abs(e.touches[0].clientX - sx) > 10 ||
        Math.abs(e.touches[0].clientY - sy) > 10) swiping = true;
  }, { passive: true });

  /* tap a card -> in-page zoom overlay (never a new page).
     Android back button closes the overlay instead of leaving the site. */
  var lb = document.getElementById('lb');
  var lbImg = document.getElementById('lb-img');
  var lbPushed = false;
  function openLb(src, alt) {
    lbImg.src = src; lbImg.alt = alt || '';
    lb.className = 'lb open';
    try { document.body.style.overflow = 'hidden'; } catch (e) {}
    try { history.pushState({ br: 'lb' }, ''); lbPushed = true; } catch (e) { lbPushed = false; }
  }
  function hideLb() {
    lb.className = 'lb'; lbImg.src = '';
    try { document.body.style.overflow = ''; } catch (e) {}
    lbPushed = false;
  }
  function closeLb() {
    if (lbPushed) { try { history.back(); return; } catch (e) {} }
    hideLb();
  }
  window.addEventListener('popstate', function () {
    if (lb.className.indexOf('open') !== -1) hideLb();
  });
  lb.addEventListener('click', closeLb);
  for (var ci = 0; ci < cards.length; ci++) {
    (function (a) {
      a.addEventListener('click', function (ev) {
        ev.preventDefault();          /* never navigate — with or without the overlay */
        if (swiping) { swiping = false; return; }
        var href = a.getAttribute('href');
        var im = a.querySelector('img');
        openLb(href, im ? im.alt : '');
        var m = /card-([a-z0-9-]+?)-\d+\.(?:jpg|png)$/i.exec(href || '');
        track('zoom', { card: m ? m[1].toLowerCase() : 'card' });
        px('ViewContent');
      });
    })(cards[ci]);
  }

  /* arrows — one card per tap, index-clamped so spamming can never overshoot
     into empty space (RTL: the LEFT arrow moves forward through the menu) */
  var interacted = false;
  function goTo(i) {
    interacted = true;
    cur = Math.max(0, Math.min(cards.length - 1, i));
    try {
      cards[cur].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    } catch (e) { cards[cur].scrollIntoView(); }
  }
  document.getElementById('ar-l').addEventListener('click', function () { goTo(cur + 1); });
  document.getElementById('ar-r').addEventListener('click', function () { goTo(cur - 1); });

  /* one gentle auto-nudge so the swipe is discoverable without reading —
     but never fight a lead who is already touching the gallery */
  var markTouched = function () { interacted = true; };
  gal.addEventListener('touchstart', markTouched, { passive: true, once: true });
  gal.addEventListener('wheel', markTouched, { passive: true, once: true });
  try {
    if (!window.matchMedia || !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      setTimeout(function () { if (!interacted) gal.scrollBy({ left: -70, behavior: 'smooth' }); }, 1100);
      setTimeout(function () { if (!interacted) gal.scrollBy({ left: 70, behavior: 'smooth' }); }, 1900);
    }
  } catch (e) {}

  /* looping video: iOS sometimes blocks autoplay — retry on first touch */
  var rv = document.getElementById('rvid');
  if (rv) {
    var kick = function () { var p = rv.play(); if (p && p.catch) p.catch(function () {}); };
    kick();
    document.addEventListener('touchstart', kick, { once: true, passive: true });
  }

  /* ?s= source tag (bio / ad / ...) rides on the visit beacon */
  var src = null;
  try {
    var m = /[?&]s=([a-z0-9_-]{1,16})(?:&|$)/i.exec(location.search);
    if (m) src = m[1].toLowerCase();
  } catch (e) { src = null; }
  track('visit', src ? { s: src } : {});
})();
